<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style-guess.css">
</head>
<body>

    <h1>Jogo de Adivinhação</h1>
    <p>Tente adivinhar o número secreto entre 0 e 99!</p>

    <!-- Campo para digitar o palpite -->
    <input type="number" id="palpiteInput" placeholder="Digite seu palpite" min="0" max="99">

    <!-- Botão que executa a função do JavaScript -->
    <button onclick="ChecarPalpite()">Enviar Palpite</button>

    <!-- Local onde aparecem as dicas e o resultado -->
    <p id="resultado" aria-live="polite"></p>

    <script src="script-guess.js"></script>
</body>
</html>
